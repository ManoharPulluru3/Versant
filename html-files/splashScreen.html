<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ElytEdu English Assessment</title>

  <!-- Nunito Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            nunito: ['Nunito Sans', 'sans-serif'],
          },
          colors: {
            cream: '#F2F5E8',
            surface: '#FCFBF8',
            green: '#1F6B4F',
            greenLight: '#DCEBDD',
            orange: '#E58A45',
            dark: '#17221D',
            muted: '#7A837D',
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Nunito Sans', sans-serif;
      background: #e8ece2;
    }

    .soft-shadow {
      box-shadow: 0 20px 60px rgba(35, 52, 43, 0.08);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-up {
      animation: fadeUp 0.8s ease-out forwards;
    }

    @keyframes pulseSoft {
      0%, 100% {
        transform: scale(1);
        opacity: 0.18;
      }

      50% {
        transform: scale(1.08);
        opacity: 0.28;
      }
    }

    .animate-pulse-soft {
      animation: pulseSoft 3s ease-in-out infinite;
    }

    @keyframes loading {
      0% {
        width: 0%;
      }

      100% {
        width: 100%;
      }
    }

    .loading-bar {
      animation: loading 2.4s ease-in-out forwards;
    }
  </style>
</head>

<body class="min-h-screen">

  <!-- APP FRAME -->
  <main
    class="relative mx-auto flex min-h-screen max-w-[430px] flex-col overflow-hidden bg-[#FCFBF8] lg:my-6 lg:min-h-[900px] lg:rounded-[40px] soft-shadow"
  >

    <!-- ===================================================== -->
    <!-- DECORATIVE BACKGROUND -->
    <!-- ===================================================== -->

    <div
      class="animate-pulse-soft absolute -right-24 -top-24 h-72 w-72 rounded-full bg-[#DCEBDD]"
    ></div>

    <div
      class="absolute -bottom-32 -left-24 h-72 w-72 rounded-full bg-[#FFF0DF]"
    ></div>


    <!-- ===================================================== -->
    <!-- MAIN SPLASH CONTENT -->
    <!-- ===================================================== -->

    <div class="relative flex flex-1 flex-col items-center justify-center px-8">

      <!-- Logo -->

      <div class="animate-fade-up flex flex-col items-center">

        <!-- Logo Mark -->

        <div
          class="relative flex h-[92px] w-[92px] items-center justify-center rounded-[30px] bg-[#1F6B4F] shadow-lg"
        >

          <!-- Decorative circle -->

          <div
            class="absolute -right-2 -top-2 h-7 w-7 rounded-full bg-[#E58A45]"
          ></div>


          <!-- Communication / Speech icon -->

          <svg
            class="relative h-11 w-11 text-white"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            viewBox="0 0 48 48"
          >

            <!-- Speech bubble -->

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 12.5A5.5 5.5 0 0 1 14.5 7h19A5.5 5.5 0 0 1 39 12.5v13A5.5 5.5 0 0 1 33.5 31H23l-8.5 7v-7h0A5.5 5.5 0 0 1 9 25.5v-13Z"
            />

            <!-- Voice waves -->

            <path
              stroke-linecap="round"
              d="M17 18h14"
            />

            <path
              stroke-linecap="round"
              d="M17 23h9"
            />

          </svg>

        </div>


        <!-- Brand -->

        <div class="mt-7 text-center">

          <h1
            class="text-[31px] font-black tracking-[-1.3px] text-[#17221D]"
          >
            Elyt<span class="text-[#1F6B4F]">Edu</span>
          </h1>

          <p
            class="mt-1 text-[11px] font-bold uppercase tracking-[2.2px] text-[#8A918B]"
          >
            English Assessment
          </p>

        </div>

      </div>


      <!-- ================================================= -->
      <!-- TAGLINE -->
      <!-- ================================================= -->

      <div
        class="animate-fade-up mt-14 max-w-[290px] text-center"
        style="animation-delay: .2s;"
      >

        <h2
          class="text-[20px] font-extrabold leading-[1.3] tracking-[-0.4px] text-[#17221D]"
        >
          Measure your English.
          <span class="text-[#1F6B4F]">
            Improve your communication.
          </span>
        </h2>

        <p
          class="mt-3 text-[12px] font-medium leading-5 text-[#7A837D]"
        >
          AI-powered assessment for Speaking, Listening,
          Reading and Writing.
        </p>

      </div>


      <!-- ================================================= -->
      <!-- SKILL INDICATORS -->
      <!-- ================================================= -->

      <div
        class="animate-fade-up mt-8 flex items-center gap-2"
        style="animation-delay: .35s;"
      >

        <!-- Speaking -->

        <div
          class="flex items-center gap-1.5 rounded-full bg-[#DCEBDD] px-3 py-1.5"
        >

          <span class="h-1.5 w-1.5 rounded-full bg-[#1F6B4F]"></span>

          <span class="text-[9px] font-extrabold text-[#1F6B4F]">
            Speaking
          </span>

        </div>


        <!-- Listening -->

        <div
          class="flex items-center gap-1.5 rounded-full bg-[#FFF0DF] px-3 py-1.5"
        >

          <span class="h-1.5 w-1.5 rounded-full bg-[#E58A45]"></span>

          <span class="text-[9px] font-extrabold text-[#9B693F]">
            Listening
          </span>

        </div>


        <!-- Reading -->

        <div
          class="flex items-center gap-1.5 rounded-full bg-[#EEEFFA] px-3 py-1.5"
        >

          <span class="h-1.5 w-1.5 rounded-full bg-[#5C63A8]"></span>

          <span class="text-[9px] font-extrabold text-[#5C63A8]">
            Reading
          </span>

        </div>


        <!-- Writing -->

        <div
          class="hidden items-center gap-1.5 rounded-full bg-[#F2E5F1] px-3 py-1.5 sm:flex"
        >

          <span class="h-1.5 w-1.5 rounded-full bg-[#9A5792]"></span>

          <span class="text-[9px] font-extrabold text-[#9A5792]">
            Writing
          </span>

        </div>

      </div>

    </div>


    <!-- ===================================================== -->
    <!-- BOTTOM -->
    <!-- ===================================================== -->

    <div class="relative px-8 pb-9">

      <!-- Loading -->

      <div class="mx-auto mb-4 h-[3px] w-[110px] overflow-hidden rounded-full bg-[#E7EBE2]">

        <div
          class="loading-bar h-full rounded-full bg-[#1F6B4F]"
        ></div>

      </div>


      <!-- Version -->

      <p class="text-center text-[9px] font-semibold tracking-[0.8px] text-[#A0A69F]">
        POWERED BY ELYTEDU
      </p>

    </div>

  </main>

</body>
</html>
