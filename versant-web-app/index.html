<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FCFBF8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      try {
        var params = new URLSearchParams(location.search)
        var stored = JSON.parse(localStorage.getItem('elytedu-theme') || '{}')
        var dark =
          params.get('theme') === 'dark' ||
          (params.get('theme') !== 'light' && !!stored.darkMode)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.bg = stored.background || 'soft'
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.content = dark ? '#101714' : '#FCFBF8'
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>ElytEdu English Assessment</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
